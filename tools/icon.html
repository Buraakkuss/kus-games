<!doctype html><html><head><meta charset="utf-8"><title>icon</title>
<style>html,body{margin:0;padding:0;background:transparent;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="k"></canvas><script>
/* Slot ikon / acilis ekrani / one cikan grafik ureteci.
   Kullanim: icon.html?s=1024 | ?s=512&round=1 | ?s=432&bg=0&scale=0.62 | ?w=1024&h=500&wide=1 */
var q = new URLSearchParams(location.search);
var S = +(q.get('s') || 1024);
var W = +(q.get('w') || S), H = +(q.get('h') || S);
var drawBg = q.get('bg') !== '0';
var scale  = +(q.get('scale') || 1);      /* adaptive icon foreground icin 0.62 */
var wide   = q.get('wide') === '1';       /* feature graphic */
var k = document.getElementById('k'), c = k.getContext('2d');
k.width = W; k.height = H; k.style.width = W+'px'; k.style.height = H+'px';
var TAU = Math.PI*2;

/* T sekli - oyundaki 'tee' ile ayni oranlar */
var TEE = [[-1.5,-1],[1.5,-1],[1.5,0],[0.5,0],[0.5,1],[-0.5,1],[-0.5,0],[-1.5,0]];
var m = 0;
for (var i=0;i<TEE.length;i++) m = Math.max(m, Math.hypot(TEE[i][0],TEE[i][1]));
for (i=0;i<TEE.length;i++){ TEE[i][0]/=m; TEE[i][1]/=m; }

/* keep=true ise mevcut yola ekler (delik delmek icin gerekli) */
function poly(x,y,r,rot,keep){
  if (!keep) c.beginPath();
  var ca=Math.cos(rot), sa=Math.sin(rot);
  for (var i=0;i<TEE.length;i++){
    var px=TEE[i][0]*r, py=TEE[i][1]*r;
    var X=x+px*ca-py*sa, Y=y+px*sa+py*ca;
    i ? c.lineTo(X,Y) : c.moveTo(X,Y);
  }
  c.closePath();
}

if (q.get('round') === '1'){
  c.save(); c.beginPath(); c.arc(W/2,H/2,Math.min(W,H)/2,0,TAU); c.clip();
}
if (drawBg){
  var g = c.createRadialGradient(W*0.5, H*0.36, 0, W*0.5, H*0.5, Math.max(W,H)*0.78);
  g.addColorStop(0,'#111a3e'); g.addColorStop(0.55,'#080d20'); g.addColorStop(1,'#03050b');
  c.fillStyle = g; c.fillRect(0,0,W,H);
  c.strokeStyle = 'rgba(120,170,255,.07)'; c.lineWidth = Math.max(1,Math.min(W,H)*0.004);
  for (var x=0;x<W;x+=Math.min(W,H)*0.085){ c.beginPath(); c.moveTo(x,0); c.lineTo(x,H); c.stroke(); }
}

var cxp = wide ? W*0.235 : W*0.5, cyp = H*0.5, U = Math.min(W,H)*scale;
var R = U*0.165, WTh = R*2.25 + U*0.05, wallY = cyp + U*0.215;

/* duvar: delik T seklinde, aci 0 */
var wTop = wallY - WTh/2;   /* dikkat: "top" global adi window.top ile cakisir */
c.save();
c.beginPath(); c.rect(0,wTop,W,WTh); c.clip();
c.beginPath(); c.rect(0,wTop,W,WTh);
poly(cxp, wallY, R*1.13, 0, true);
var wg = c.createLinearGradient(0,wTop,0,wTop+WTh);
wg.addColorStop(0,'#4a5899'); wg.addColorStop(0.5,'#333e73'); wg.addColorStop(1,'#1f2750');
c.fillStyle = wg; c.fill('evenodd');
c.restore();
c.fillStyle = 'rgba(160,195,255,.42)'; c.fillRect(0,wTop,W,Math.max(1,U*0.010));
c.fillStyle = 'rgba(0,0,0,.45)'; c.fillRect(0,wTop+WTh-Math.max(1,U*0.010),W,Math.max(1,U*0.010));
c.lineWidth = U*0.014; c.strokeStyle = 'rgba(77,219,255,.75)';
c.shadowBlur = U*0.05; c.shadowColor = 'rgba(77,219,255,.8)';
poly(cxp, wallY, R*1.13, 0); c.stroke(); c.shadowBlur = 0;

/* donen sekil: delige oturmak icin 26 derece kalmis */
var ang = -0.45;
c.save();
c.shadowBlur = U*0.10; c.shadowColor = 'rgba(77,219,255,.95)';
var sg = c.createLinearGradient(cxp-R, cyp-U*0.225-R, cxp+R, cyp-U*0.225+R);
sg.addColorStop(0,'#a6f4ff'); sg.addColorStop(1,'#2f6dff');
poly(cxp, cyp - U*0.225, R, ang);
c.fillStyle = sg; c.fill();
c.shadowBlur = 0;
c.lineWidth = U*0.016; c.strokeStyle = 'rgba(255,255,255,.85)'; c.stroke();
c.restore();

/* donus oku */
c.strokeStyle = 'rgba(255,204,77,.9)'; c.lineWidth = U*0.022; c.lineCap = 'round';
c.beginPath(); c.arc(cxp, cyp - U*0.225, R*1.5, -2.45, -0.9); c.stroke();
var ax = cxp + Math.cos(-0.9)*R*1.5, ay = (cyp - U*0.225) + Math.sin(-0.9)*R*1.5;
c.beginPath();
c.moveTo(ax + U*0.045, ay - U*0.012);
c.lineTo(ax - U*0.018, ay - U*0.045);
c.lineTo(ax - U*0.030, ay + U*0.035);
c.closePath(); c.fillStyle = 'rgba(255,204,77,.95)'; c.fill();

if (wide){
  c.textAlign = 'left'; c.fillStyle = '#ffffff';
  c.font = '900 ' + Math.round(H*0.21) + 'px ui-rounded, system-ui, sans-serif';
  c.fillText('SLOT', W*0.42, H*0.50);
  c.fillStyle = '#8a93b8';
  c.font = '700 ' + Math.round(H*0.068) + 'px ui-rounded, system-ui, sans-serif';
  c.fillText('ONE TAP  ·  FIT THE SHAPE', W*0.425, H*0.645);
}
if (q.get('round') === '1') c.restore();
document.title = 'ICON:READY';
</script></body></html>
