name: Next Wave

# Next Wave modüler TypeScript'tir; diger uc oyunun android/ios matrisine
# henuz girmiyor (0.1.x bir web surumu). Bu is akisi onun yerine gecer:
# her push'ta mimari kural, tip denetimi, denge simulasyonu ve derleme.
on:
  push:
    branches: ['**']
    paths:
      - 'nextwave/**'
      - 'docs/nextwave/**'
      - '.github/workflows/nextwave.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    name: nextwave
    defaults:
      run:
        working-directory: nextwave
    steps:
      - uses: actions/checkout@v4

      # tools/sim.ts Node'da DOGRUDAN calisir (--experimental-strip-types).
      # Bunun icin Node 22 gerekir; 20 ile "Unknown file extension .ts" alinir.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nextwave/package-lock.json

      - name: Bagimliliklar
        run: npm ci --no-audit --no-fund

      - name: Dogrulama (mimari · tip · sema · denge · derleme)
        env:
          # check.js tarayici self-testi icin Chromium arar; ubuntu
          # kosucusunda Chrome kurulu gelir. Bulunmazsa o adim atlanir.
          CHROME: /usr/bin/google-chrome
          RUNS: '80'
        run: node tools/check.js

      - name: Yayindaki paket guncel mi
        # docs/nextwave/play/ elle kopyalanan bir DERLEME CIKTISIDIR.
        # Kaynak degisip yayin adimi unutulursa oyuncular eski surumu oynar
        # ve bunu kimse fark etmez. Bu adim tam olarak onu yakalar.
        run: |
          WANT=$(grep -o 'assets/[^"]*\.js' www/index.html)
          HAVE=$(grep -o 'assets/[^"]*\.js' ../docs/nextwave/play/index.html || echo 'yok')
          echo "derlenen: $WANT"
          echo "yayinda : $HAVE"
          if [ "$WANT" != "$HAVE" ]; then
            echo "::error::Yayindaki paket bayat. Calistir: bash nextwave/tools/publish-web.sh"
            exit 1
          fi
          if ! cmp -s "www/$WANT" "../docs/nextwave/play/$WANT"; then
            echo "::error::Ayni adda ama farkli icerikli paket. Calistir: bash nextwave/tools/publish-web.sh"
            exit 1
          fi
          echo "Yayindaki paket derlemeyle ayni."

      - name: Paket boyutu
        run: |
          SIZE=$(du -k www/assets/*.js | cut -f1)
          echo "paket: ${SIZE} KB (buyuk kismi Phaser)"
          if [ "$SIZE" -gt 2600 ]; then
            echo "::warning::Paket ${SIZE} KB - kod bolme dusunulmeli"
          fi
