<!doctype html><html><head><meta charset="utf-8"><title>icon</title>
<style>html,body{margin:0;padding:0;background:transparent;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="k"></canvas><script>
/* Seher ikon / acilis ekrani / one cikan grafik ureteci.
   Kullanim: icon.html?s=1024 | ?s=512&round=1 | ?s=432&bg=0&scale=0.62
             ?w=1024&h=500&wide=1        (Play one cikan grafik)
             ?s=96&mono=1                (Android bildirim simgesi: beyaz siluet)
   Motif: hilal + sekiz kollu yildiz, ustunde mihrap kemeri hatti.
   DIKKAT: yol delmek icin fill('evenodd') kullaniliyor; hilali olusturan iki
   daire AYNI yolda olmali, ikincisinden once beginPath() cagirma.            */
var q = new URLSearchParams(location.search);
var S = +(q.get('s') || 1024);
var W = +(q.get('w') || S), H = +(q.get('h') || S);
var drawBg = q.get('bg') !== '0';
var scale  = +(q.get('scale') || 1);      /* adaptive icon foreground icin 0.62 */
var wide   = q.get('wide') === '1';       /* one cikan grafik */
var mono   = q.get('mono') === '1';       /* bildirim simgesi: sadece beyaz siluet */
var k = document.getElementById('k'), c = k.getContext('2d');
k.width = W; k.height = H; k.style.width = W+'px'; k.style.height = H+'px';
var TAU = Math.PI*2;

var GOLD1 = '#f5d67e', GOLD2 = '#d99c1f', MINT = '#3ec9a7';

/* Sekiz kollu yildiz (rub el hizb benzeri): ust uste iki kare */
function yildiz(x, y, r, rot){
  c.beginPath();
  for (var i = 0; i < 16; i++){
    var a = rot + i*Math.PI/8;
    var rr = (i % 2 === 0) ? r : r*0.52;
    var X = x + Math.cos(a)*rr, Y = y + Math.sin(a)*rr;
    i ? c.lineTo(X,Y) : c.moveTo(X,Y);
  }
  c.closePath();
}

/* Hilal: buyuk daireden kaydirilmis kucuk daire cikarilir (evenodd).
   Kalinlik = r - kes + kaydir, agiz genisligi kaydir ile buyur.
   Iki deneme bosa gitti: 0.82/0.34 hilali "C" harfi gibi sismanlatti,
   0.97/0.20 ise agzi kapatip yuzuge cevirdi. Asagidaki oranlar Turk
   bayragindaki hilalin oranlaridir (R=1, ic yaricap 0.80, kayma 0.25).      */
var KES = 0.80, KAYDIR = 0.25;   /* Turk bayragindaki hilalin oranlari */
function hilal(x, y, r){
  c.beginPath();
  c.arc(x, y, r, 0, TAU);
  c.moveTo(x + r*KAYDIR + r*KES, y);
  c.arc(x + r*KAYDIR, y, r*KES, 0, TAU, true);
  c.closePath();
}

/* ---------- bildirim simgesi: tek renk, seffaf zemin ---------- */
if (mono){
  var mr = Math.min(W,H)*0.30, mx = W*0.44, my = H/2;
  c.fillStyle = '#ffffff';
  c.save(); c.translate(mx, my); c.rotate(-0.42); c.translate(-mx, -my);
  hilal(mx, my, mr);
  c.fill('evenodd');
  c.restore();
  /* bildirim simgesinde yildiz da beyaz siluetin parcasidir */
  c.save(); c.translate(mx, my); c.rotate(-0.42); c.translate(-mx, -my);
  yildiz(mx + mr*1.33, my, mr*0.30, -Math.PI/8); c.fill();
  c.restore();
  document.title = 'ICON:READY';
} else {

if (q.get('round') === '1'){
  c.save(); c.beginPath(); c.arc(W/2,H/2,Math.min(W,H)/2,0,TAU); c.clip();
}

/* ---------- zemin: seher vaktinin rengi (koyu yesil-mavi -> siyah) ---------- */
if (drawBg){
  var g = c.createRadialGradient(W*0.5, H*0.30, 0, W*0.5, H*0.55, Math.max(W,H)*0.85);
  g.addColorStop(0,'#14483d'); g.addColorStop(0.45,'#0a2a24'); g.addColorStop(1,'#030f0d');
  c.fillStyle = g; c.fillRect(0,0,W,H);
  /* ince geometrik ag - tasarlanmis bir doku, duz zemin degil */
  var adim = Math.min(W,H)*0.085;
  c.strokeStyle = 'rgba(227,178,60,.05)';
  c.lineWidth = Math.max(1, Math.min(W,H)*0.0022);
  for (var gx = -H; gx < W+H; gx += adim){
    c.beginPath(); c.moveTo(gx,0); c.lineTo(gx+H,H); c.stroke();
    c.beginPath(); c.moveTo(gx,H); c.lineTo(gx+H,0); c.stroke();
  }
  /* ufuk parlamasi */
  var hg = c.createLinearGradient(0, H*0.62, 0, H);
  hg.addColorStop(0,'rgba(227,178,60,0)'); hg.addColorStop(0.72,'rgba(227,178,60,.07)'); hg.addColorStop(1,'rgba(62,201,167,.20)');
  c.fillStyle = hg; c.fillRect(0, H*0.62, W, H*0.38);
}

/* Hilal + yildiz birlikte bir grup; grubun agirlik merkezi saga kaydigi icin
   hilali sola alip grubu kareye ortaliyoruz. */
var U = Math.min(wide ? H : W, H)*scale;
var R = U*0.275;
var cxp = (wide ? W*0.20 : W*0.5) - R*0.22, cyp = H*0.50;

/* ---------- hilal ---------- */
var EGIM = -0.42;                 /* hilalin acikligi sag ust yone bakar */
c.save();
c.translate(cxp, cyp); c.rotate(EGIM); c.translate(-cxp, -cyp);
c.shadowBlur = U*0.075; c.shadowColor = 'rgba(245,214,126,.65)';
var sg = c.createLinearGradient(cxp-R, cyp-R*0.8, cxp+R*0.4, cyp+R);
sg.addColorStop(0, GOLD1); sg.addColorStop(0.62, '#eab942'); sg.addColorStop(1, GOLD2);
c.fillStyle = sg;
hilal(cxp, cyp, R);
c.fill('evenodd');
c.shadowBlur = 0;
c.restore();

/* ---------- yildiz: hilalin acikligina oturur ---------- */
/* yildiz hilalin agzinda, altin yuzeyin disinda durur */
var yr = R*0.30;
var yx = cxp + Math.cos(EGIM)*R*1.33, yy = cyp + Math.sin(EGIM)*R*1.33;
c.save();
c.shadowBlur = U*0.06; c.shadowColor = 'rgba(62,201,167,.85)';
var yg = c.createLinearGradient(yx-yr, yy-yr, yx+yr, yy+yr);
yg.addColorStop(0,'#bff6e6'); yg.addColorStop(1, MINT);
c.fillStyle = yg;
yildiz(yx, yy, yr, -Math.PI/8);
c.fill();
c.shadowBlur = 0;
c.restore();

if (wide){
  c.textAlign = 'left';
  c.fillStyle = '#ffffff';
  c.font = '900 ' + Math.round(H*0.22) + 'px ui-rounded, system-ui, sans-serif';
  c.fillText('SEHER', W*0.405, H*0.50);
  c.fillStyle = '#9fb8b0';
  c.font = '700 ' + Math.round(H*0.070) + 'px ui-rounded, system-ui, sans-serif';
  c.fillText('NAMAZ VAKTİ  ·  KIBLE  ·  ZİKİR', W*0.410, H*0.655);
  c.fillStyle = 'rgba(227,178,60,.9)';
  c.font = '800 ' + Math.round(H*0.055) + 'px ui-rounded, system-ui, sans-serif';
  c.fillText('İNTERNETSİZ ÇALIŞIR', W*0.410, H*0.775);
}
if (q.get('round') === '1') c.restore();
document.title = 'ICON:READY';
}
</script></body></html>
